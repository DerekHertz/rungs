<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rungs</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141a;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #trail {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 100%;
        padding: 0 8px;
        overflow-x: auto;
        white-space: nowrap;
        color: #e8edf2;
      }
      #bar {
        flex: none;
        display: flex;
        align-items: center;
        height: 28px;
        border-bottom: 1px solid #263140;
      }
      #legend {
        position: absolute;
        left: 10px;
        bottom: 10px;
        max-width: 420px;
        padding: 6px 8px;
        background: #000a;
        color: #b8c8de;
        pointer-events: none;
      }
      #legend div {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      #legend div + div {
        margin-top: 4px;
      }
      #legend span {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #legend i {
        width: 10px;
        height: 10px;
        border: 1px solid #0008;
      }
      #controls {
        position: absolute;
        left: 10px;
        top: 10px;
        display: flex;
        gap: 6px;
      }
      #controls button {
        font: inherit;
        color: #b8c8de;
        background: #000a;
        border: 1px solid #263140;
        padding: 3px 8px;
        cursor: pointer;
      }
      #controls button:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #trail button {
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 2px 4px;
        cursor: pointer;
      }
      #trail button:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #trail i {
        font-style: normal;
        color: #5b6b7e;
      }
      #main {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      #review {
        flex: none;
        width: 360px;
        display: flex;
        flex-direction: column;
        background: #0b0f14;
        color: #d6dee8;
        border-right: 1px solid #263140;
        overflow: hidden;
      }
      #review[hidden] {
        display: none;
      }
      .review-section {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-bottom: 1px solid #263140;
      }
      .review-section:first-child {
        flex: 0 1 20%;
      }
      .review-section:last-child {
        flex-grow: 1.6;
        border-bottom: 0;
      }
      .review-title {
        flex: none;
        margin: 0;
        padding: 8px 10px 4px;
        font-size: 12px;
        color: #ffd84a;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .review-tag {
        font-weight: 400;
        font-size: 10px;
        padding: 0 5px;
        border: 1px solid #5b6b7e;
        color: #8a9bb0;
        border-radius: 2px;
      }
      .review-tag.claimed {
        border-style: dashed;
        color: #e6b85c;
        border-color: #e6b85c;
      }
      .review-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 2px 10px 8px;
      }
      .review-tag.observed {
        border-style: dotted;
        color: #7ee0c8;
        border-color: #7ee0c8;
      }
      .review-warning {
        margin: 2px 0 6px;
        color: #E69F00;
      }
      .review-mark.observed-fail {
        color: #E69F00;
      }
      .review-mark.observed-pass {
        color: #7ee0c8;
      }
      .review-mark.observed-none,
      .review-mark.observed-skip {
        color: #5b6b7e;
      }
      .observed-message {
        color: #b8c4d2;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .observed-output {
        margin: 0;
        font: inherit;
        font-size: 11px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #b8c4d2;
      }
      .observed-unmatched summary {
        cursor: pointer;
      }
      .observed-loose {
        display: flex;
        gap: 6px;
        padding: 2px 4px;
      }
      .review-claim {
        margin: 0;
        font: inherit;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #e6d9b8;
        font-style: italic;
        border-left: 2px dashed #e6b85c;
        padding-left: 8px;
      }
      .review-subtitle {
        margin: 8px 0 2px;
        font-size: 12px;
        font-weight: 600;
        color: #b8c4d4;
      }
      .review-claim-row {
        text-align: left;
      }
      .review-claim-row .review-claim {
        white-space: pre-wrap;
        border-left: 0;
        padding-left: 0;
        font-style: italic;
        color: #e6d9b8;
      }
      .review-claim-row:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .by-agent > .review-line .review-label {
        font-style: italic;
        color: #e6d9b8;
        text-decoration: underline dashed #e6b85c;
        text-underline-offset: 3px;
      }
      .by-agent .linked > .review-line .review-label {
        font-weight: 600;
      }
      .review-empty,
      .review-summary {
        margin: 2px 0 6px;
        color: #8a9bb0;
      }
      .review-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .review-list .review-list {
        padding-left: 14px;
      }
      .review-line {
        display: flex;
        align-items: stretch;
      }
      .review-toggle {
        flex: none;
        width: 16px;
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .review-pick {
        flex: 1;
        min-width: 0;
        display: flex;
        gap: 6px;
        align-items: baseline;
        font: inherit;
        text-align: left;
        color: #d6dee8;
        background: none;
        border: 0;
        padding: 2px 4px;
        cursor: pointer;
      }
      .review-pick:hover {
        background: #1f2a3a;
      }
      .review-pick.active {
        background: #26364d;
      }
      .review-mark {
        flex: none;
        width: 10px;
        font-weight: 700;
      }
      .review-mark.added {
        color: #fff;
      }
      .review-mark.altered {
        color: #ffd84a;
      }
      .review-mark.removed {
        color: #ff7b72;
      }
      .review-mark.moved {
        color: #9aa6b5;
      }
      .review-label {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .review-size {
        flex: none;
        color: #5b6b7e;
      }
      .review-flag {
        flex: none;
        font-size: 10px;
        padding: 0 4px;
        color: #e6b85c;
        border: 1px solid #e6b85c;
        border-radius: 2px;
      }
      .review-mark.contract-effects {
        color: #6cb6ff;
      }
      .review-mark.contract-changed {
        color: #ffd84a;
      }
      .review-mark.contract-added {
        color: #fff;
      }
      .review-mark.contract-removed,
      .review-mark.contract-unexported {
        color: #ff7b72;
      }
      .review-mark.contract-exposed {
        color: #7ee787;
      }
      .review-mark.contract-moved {
        color: #9aa6b5;
      }
      .review-effects {
        margin-bottom: 6px;
      }
      .review-note {
        margin: 0 0 4px;
        padding: 0 10px;
        color: #5b6b7e;
        font-size: 11px;
      }
      .effect-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
      }
      .effect-chip {
        font-size: 10px;
        padding: 0 4px;
        border-radius: 2px;
        border: 1px solid #263140;
        white-space: nowrap;
      }
      .effect-chip.added {
        color: #7ee787;
        border-color: #1f4a2c;
      }
      .effect-chip.removed {
        color: #ff7b72;
        border-color: #5a2a2a;
      }
      .effect-chip.more {
        color: #9aa6b5;
      }
      .contract-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .contract-head {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .contract-where {
        color: #5b6b7e;
        overflow-wrap: anywhere;
      }
      .contract-sig {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #b8c4d2;
      }
      .contract-side {
        display: inline-block;
        width: 46px;
        color: #5b6b7e;
      }
      .contract-sig mark {
        color: inherit;
        padding: 0 1px;
      }
      .contract-sig mark.removed {
        background: #5a2a2a;
      }
      .contract-sig mark.added {
        background: #1f4a2c;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      #source {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 40%;
        display: flex;
        flex-direction: column;
        background: #0b0f14;
        color: #d6dee8;
        border-left: 1px solid #263140;
        box-shadow: -8px 0 16px #0008;
      }
      #source[hidden] {
        display: none;
      }
      #source header {
        flex: none;
        position: relative;
        padding: 8px 32px 8px 10px;
        border-bottom: 1px solid #263140;
      }
      #source-title {
        color: #ffd84a;
        overflow-wrap: anywhere;
      }
      #source-facts {
        color: #8a9bb0;
        overflow-wrap: anywhere;
      }
      #source-close {
        position: absolute;
        top: 6px;
        right: 6px;
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 2px 6px;
        cursor: pointer;
      }
      #source-close:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #source-mark {
        position: absolute;
        left: 0;
        z-index: 2;
        background: #ffd84a2e;
        border-top: 1px solid #ffd84a99;
        border-bottom: 1px solid #ffd84a99;
        pointer-events: none;
      }
      #source-mark[hidden] {
        display: none;
      }
      #source-body {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        overflow: auto;
        line-height: 1.5;
      }
      #source-body pre {
        margin: 0;
        font: inherit;
        line-height: inherit;
      }
      #source-gutter {
        flex: none;
        position: sticky;
        left: 0;
        padding: 6px 8px;
        text-align: right;
        color: #5b6b7e;
        background: #0b0f14;
        border-right: 1px solid #1c2531;
        user-select: none;
      }
      #source-code {
        flex: none;
        padding: 6px 10px;
        tab-size: 2;
      }
      .name {
        position: absolute;
        left: 0;
        top: 0;
        padding: 2px 7px;
        background: #0a0d12e6;
        color: #eef2f6;
        border: 1px solid #2c3a4d;
        border-left: 5px solid;
        border-radius: 2px;
        white-space: nowrap;
        line-height: 1.25;
      }
      .name-near {
        font-size: 15px;
        font-weight: 700;
      }
      .name-far {
        font-size: 12px;
      }
      .name-file {
        font-size: 12px;
        color: #fff;
        border-color: #fff;
      }
      .name-resource {
        font-size: 13px;
        font-weight: 700;
      }
      #tooltip {
        position: fixed;
        pointer-events: none;
        padding: 4px 6px;
        background: #000d;
        color: #e8edf2;
        white-space: pre;
        display: none;
      }
    </style>
  </head>
  <body>
    <header id="bar"><nav id="trail" aria-label="Zoom trail"></nav></header>
    <div id="main">
    <aside id="review" aria-label="Review" hidden></aside>
    <div id="stage">
      <div id="controls">
        <button id="reset" type="button" title="R">Reset view (R)</button>
        <button id="pixel" type="button" title="P">Pixel: off (P)</button>
      </div>
      <div id="legend" aria-label="Legend"></div>
      <aside id="source" aria-label="Source" hidden>
        <header>
          <div id="source-title"></div>
          <div id="source-facts"></div>
          <button id="source-close" type="button" aria-label="Close source">&times;</button>
        </header>
        <div id="source-body"><pre id="source-gutter"></pre><pre id="source-code"></pre><div id="source-mark" hidden></div></div>
      </aside>
    </div>
    </div>
    <div id="tooltip"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
