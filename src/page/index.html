<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rungs</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141a;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #trail {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 100%;
        padding: 0 8px;
        overflow-x: auto;
        white-space: nowrap;
        color: #e8edf2;
      }
      #bar {
        flex: none;
        display: flex;
        align-items: center;
        height: 28px;
        border-bottom: 1px solid #263140;
      }
      #legend {
        position: absolute;
        left: 10px;
        bottom: 10px;
        max-width: 420px;
        padding: 6px 8px;
        background: #000a;
        color: #b8c8de;
        pointer-events: none;
      }
      #legend div {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      #legend div + div {
        margin-top: 4px;
      }
      #legend span {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #legend i {
        width: 10px;
        height: 10px;
        border: 1px solid #0008;
      }
      #controls {
        position: absolute;
        left: 10px;
        top: 10px;
        display: flex;
        gap: 6px;
      }
      #controls button {
        font: inherit;
        color: #b8c8de;
        background: #000a;
        border: 1px solid #263140;
        padding: 3px 8px;
        cursor: pointer;
      }
      #controls button:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #trail button {
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 2px 4px;
        cursor: pointer;
      }
      #trail button:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #trail i {
        font-style: normal;
        color: #5b6b7e;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #source {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 40%;
        display: flex;
        flex-direction: column;
        background: #0b0f14;
        color: #d6dee8;
        border-left: 1px solid #263140;
        box-shadow: -8px 0 16px #0008;
      }
      #source[hidden] {
        display: none;
      }
      #source header {
        flex: none;
        position: relative;
        padding: 8px 32px 8px 10px;
        border-bottom: 1px solid #263140;
      }
      #source-title {
        color: #ffd84a;
        overflow-wrap: anywhere;
      }
      #source-facts {
        color: #8a9bb0;
        overflow-wrap: anywhere;
      }
      #source-close {
        position: absolute;
        top: 6px;
        right: 6px;
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 2px 6px;
        cursor: pointer;
      }
      #source-close:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #source-body {
        flex: 1;
        min-height: 0;
        display: flex;
        overflow: auto;
        line-height: 1.5;
      }
      #source-body pre {
        margin: 0;
        font: inherit;
        line-height: inherit;
      }
      #source-gutter {
        flex: none;
        position: sticky;
        left: 0;
        padding: 6px 8px;
        text-align: right;
        color: #5b6b7e;
        background: #0b0f14;
        border-right: 1px solid #1c2531;
        user-select: none;
      }
      #source-code {
        flex: none;
        padding: 6px 10px;
        tab-size: 2;
      }
      #tooltip {
        position: fixed;
        pointer-events: none;
        padding: 4px 6px;
        background: #000d;
        color: #e8edf2;
        white-space: pre;
        display: none;
      }
    </style>
  </head>
  <body>
    <header id="bar"><nav id="trail" aria-label="Zoom trail"></nav></header>
    <div id="stage">
      <div id="controls">
        <button id="reset" type="button" title="R">Reset view (R)</button>
        <button id="pixel" type="button" title="P">Pixel: off (P)</button>
      </div>
      <div id="legend" aria-label="Legend"></div>
      <aside id="source" aria-label="Source" hidden>
        <header>
          <div id="source-title"></div>
          <div id="source-facts"></div>
          <button id="source-close" type="button" aria-label="Close source">&times;</button>
        </header>
        <div id="source-body"><pre id="source-gutter"></pre><pre id="source-code"></pre></div>
      </aside>
    </div>
    <div id="tooltip"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
