<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rungs</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141a;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #trail {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 8px;
        overflow-x: auto;
        white-space: nowrap;
        color: #e8edf2;
        border-bottom: 1px solid #263140;
      }
      #trail button {
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 2px 4px;
        cursor: pointer;
      }
      #trail button:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #trail i {
        font-style: normal;
        color: #5b6b7e;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #tooltip {
        position: fixed;
        pointer-events: none;
        padding: 4px 6px;
        background: #000d;
        color: #e8edf2;
        white-space: pre;
        display: none;
      }
    </style>
  </head>
  <body>
    <nav id="trail" aria-label="Zoom trail"></nav>
    <div id="stage"><canvas id="picture"></canvas></div>
    <div id="tooltip"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
