<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Systems to Streets</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10141a;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #trail {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 100%;
        padding: 0 8px;
        overflow-x: auto;
        white-space: nowrap;
        color: #e8edf2;
      }
      #bar {
        position: relative;
        flex: none;
        display: flex;
        align-items: center;
        height: 28px;
        border-bottom: 1px solid #263140;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Every control shows where the keyboard is. */
      :focus-visible {
        outline: 2px solid #8fb4d9;
        outline-offset: 1px;
      }
      #find-box {
        flex: none;
        position: relative;
        padding: 0 6px;
      }
      #find {
        box-sizing: border-box;
        width: 240px;
        height: 24px;
        padding: 0 6px;
        font: inherit;
        color: #e8edf2;
        background: #0b0f14;
        border: 1px solid #3b4d66;
        border-radius: 2px;
      }
      #find::placeholder {
        color: #8a9bb0;
      }
      #find-results {
        position: absolute;
        z-index: 30;
        top: calc(100% + 3px);
        right: 0;
        width: 520px;
        max-width: calc(100vw - 8px);
        max-height: min(60vh, 420px);
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
        background: #0b0f14;
        color: #d6dee8;
        border: 1px solid #3b4d66;
        box-shadow: 0 8px 16px #000a;
      }
      #find-results[hidden] {
        display: none;
      }
      #find-results li {
        display: flex;
        gap: 8px;
        align-items: baseline;
        min-height: 24px;
        padding: 4px 8px;
        cursor: pointer;
      }
      #find-results li:hover {
        background: #1f2a3a;
      }
      #find-results li[aria-selected="true"] {
        background: #26364d;
        outline: 1px solid #8fb4d9;
        outline-offset: -1px;
      }
      #find-results .find-path {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      #find-results .find-kind {
        flex: none;
        color: #8a9bb0;
      }
      #find-results .find-more {
        color: #8a9bb0;
        cursor: default;
      }
      #views {
        display: none;
      }
      #source-back {
        display: none;
      }
      #legend {
        position: absolute;
        left: 10px;
        bottom: 10px;
        max-width: min(420px, calc(100% - 20px));
        padding: 6px 8px;
        background: #000a;
        color: #b8c8de;
        pointer-events: none;
      }
      #legend button {
        pointer-events: auto;
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      #legend section {
        margin-top: 4px;
        max-height: min(40vh, 360px);
        overflow: auto;
        pointer-events: auto;
      }
      #legend section[hidden] {
        display: none;
      }
      #legend div {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      #legend div + div {
        margin-top: 4px;
      }
      #legend span {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #legend i {
        width: 10px;
        height: 10px;
        border: 1px solid #0008;
      }
      #controls {
        position: absolute;
        left: 10px;
        top: 10px;
        display: flex;
        gap: 6px;
      }
      #controls button {
        font: inherit;
        color: #b8c8de;
        background: #000a;
        border: 1px solid #263140;
        padding: 3px 8px;
        cursor: pointer;
      }
      #controls button:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #trail button {
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 2px 4px;
        cursor: pointer;
      }
      #trail button:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #controls button,
      #legend button,
      #trail button,
      #source-close,
      .walk-button,
      .walk-tab,
      .walk-call,
      .rv-info,
      .review-toggle,
      .review-pick,
      .why-toggle,
      .contract-more,
      .narration-again,
      .rv-about-toggle,
      .outline-line button {
        min-width: 24px;
        min-height: 24px;
      }
      #trail i {
        font-style: normal;
        color: #5b6b7e;
      }
      #main {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      #review {
        flex: none;
        width: 392px;
        display: flex;
        flex-direction: column;
        background: #0b0f14;
        color: #d6dee8;
        border-right: 1px solid #263140;
        overflow: hidden;
      }
      #review[hidden] {
        display: none;
      }
      .rv-row {
        flex: none;
        display: flex;
        flex-direction: column;
        border-bottom: 1px solid #263140;
      }
      .rv-row.open {
        flex: 1 1 0;
        min-height: 0;
      }
      .rv-head {
        flex: none;
        margin: 0;
        font-size: 12px;
        font-weight: 400;
        display: flex;
        align-items: stretch;
      }
      .rv-toggle {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 6px;
        font: inherit;
        text-align: left;
        color: #d6dee8;
        background: none;
        border: 0;
        padding: 9px 10px;
        cursor: pointer;
      }
      .rv-toggle:hover,
      .rv-about-toggle:hover,
      .rv-info:hover {
        background: #1f2a3a;
      }
      .rv-row.open > .rv-head .rv-toggle {
        background: #121a24;
      }
      .rv-chevron {
        flex: none;
        width: 10px;
        color: #8fb4d9;
      }
      .rv-name-label {
        flex: none;
        color: #ffd84a;
        font-weight: 600;
      }
      .rv-summary {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rv-toggle .review-tag {
        flex: none;
        font-size: 8px;
        padding: 0 3px;
      }
      .rv-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 2px 10px 8px;
      }
      .rv-body[hidden],
      .rv-note[hidden],
      .rv-about-body[hidden],
      .rv-detail[hidden],
      .rv-full[hidden] {
        display: none;
      }
      .rv-info {
        flex: none;
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 0 10px;
        cursor: pointer;
      }
      .rv-note {
        margin: 0;
        padding: 2px 10px 8px 26px;
        color: #8a9bb0;
        font-size: 11px;
      }
      /* One line, never wrapped: the full text is the title on hover. */
      #headline[hidden] {
        display: none;
      }
      #headline {
        flex: none;
        margin: 0;
        padding: 6px 10px;
        color: #e8edf2;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid #263140;
      }
      .rv-arrival {
        flex: none;
        padding: 8px 10px;
        border-bottom: 1px solid #263140;
      }
      .rv-compared {
        margin: 0 0 6px;
        color: #b8c4d4;
        overflow-wrap: anywhere;
      }
      .rv-entries {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .rv-entry {
        font: inherit;
        font-size: 12px;
        min-height: 28px;
        padding: 4px 10px;
        color: #e8edf2;
        background: #1f2a3a;
        border: 1px solid #3b4d66;
        border-radius: 2px;
        cursor: pointer;
      }
      /* A test file's row wraps its flag and counts under the path rather than squeezing the path. */
      .observed-file {
        flex-wrap: wrap;
      }
      .observed-file > .review-label {
        flex: 1 1 14ch;
      }
      .rv-entry:hover {
        background: #26364d;
      }
      .rv-entry.off {
        color: #8a9bb0;
        background: none;
        border-style: dashed;
        cursor: default;
      }
      .rv-entry:focus-visible,
      .review-pick:focus-visible {
        outline: 2px solid #8fb4d9;
        outline-offset: 1px;
      }
      .rv-about {
        flex: none;
        display: flex;
        flex-direction: column;
        max-height: 35%;
        border-top: 1px solid #263140;
      }
      .rv-about-body {
        overflow: auto;
        padding: 2px 10px 6px;
      }
      .rv-about-toggle {
        flex: none;
        font: inherit;
        font-size: 12px;
        text-align: left;
        color: #8a9bb0;
        background: none;
        border: 0;
        padding: 7px 10px;
        cursor: pointer;
      }
      .rv-one {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rv-full {
        margin: 0 0 4px 4px;
      }
      .rv-ellipsis,
      .rv-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rv-name {
        flex: 0 1 auto;
        max-width: 55%;
      }
      .rv-change {
        flex: 1;
        min-width: 0;
      }
      .rv-detail {
        padding: 0 4px 6px 20px;
      }
      .review-row > .review-pick {
        width: 100%;
      }
      /* A row whose detail is a long name: the name keeps a readable width and the detail drops under it, whole. */
      .review-pick.wrap {
        flex-wrap: wrap;
      }
      .review-pick.wrap > .review-label {
        flex: 1 1 12ch;
      }
      .review-pick.wrap > .contract-where {
        order: 3;
        flex: 1 1 100%;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        overflow-wrap: anywhere;
      }
      .review-row {
        min-width: 0;
      }
      .review-claim-row .rv-one.review-claim {
        white-space: nowrap;
      }
      .review-row.unlinked .review-claim {
        color: #b8c4d2;
      }
      .effect-pick .contract-text {
        gap: 0;
      }
      .review-tag {
        font-weight: 400;
        font-size: 10px;
        padding: 0 5px;
        border: 1px solid #5b6b7e;
        color: #8a9bb0;
        border-radius: 2px;
      }
      .review-tag.claimed {
        border-style: dashed;
        color: #e6b85c;
        border-color: #e6b85c;
      }
      .review-tag.judged {
        background: #3a4658;
        border-color: #3a4658;
        color: #d6deea;
      }
      .review-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 2px 10px 8px;
      }
      .review-tag.observed {
        border-style: dotted;
        color: #7ee0c8;
        border-color: #7ee0c8;
      }
      .review-warning {
        margin: 2px 0 6px;
        color: #E69F00;
      }
      .review-mark.observed-fail {
        color: #E69F00;
      }
      .review-mark.observed-pass {
        color: #7ee0c8;
      }
      .review-mark.observed-none,
      .review-mark.observed-skip {
        color: #5b6b7e;
      }
      .observed-message {
        color: #b8c4d2;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .observed-output {
        margin: 0;
        font: inherit;
        font-size: 11px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #b8c4d2;
      }
      .observed-unmatched summary {
        cursor: pointer;
      }
      .observed-dim {
        opacity: 0.6;
      }
      .observed-loose {
        display: flex;
        gap: 6px;
        padding: 2px 4px;
      }
      .review-claim {
        margin: 0;
        font: inherit;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #e6d9b8;
        font-style: italic;
        border-left: 2px dashed #e6b85c;
        padding-left: 8px;
      }
      .review-subtitle {
        margin: 8px 0 2px;
        font-size: 12px;
        font-weight: 600;
        color: #b8c4d4;
      }
      .review-claim-row {
        text-align: left;
      }
      .review-claim-row .review-claim {
        border-left: 0;
        padding-left: 0;
        font-style: italic;
        color: #e6d9b8;
      }
      .review-claim-row:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .by-agent > .review-line .review-label {
        font-style: italic;
        color: #e6d9b8;
        text-decoration: underline dashed #e6b85c;
        text-underline-offset: 3px;
      }
      .by-agent .linked > .review-line .review-label {
        font-weight: 600;
      }
      .review-empty,
      .review-source {
        margin: 4px 0 6px 8px;
        font-size: 12px;
        opacity: 0.75;
      }
      .review-summary {
        margin: 2px 0 6px;
        color: #8a9bb0;
      }
      .review-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .review-list .review-list {
        padding-left: 14px;
      }
      .review-line {
        display: flex;
        align-items: stretch;
      }
      .review-toggle {
        flex: none;
        width: 16px;
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .review-pick {
        flex: 1;
        min-width: 0;
        display: flex;
        gap: 6px;
        align-items: baseline;
        font: inherit;
        text-align: left;
        color: #d6dee8;
        background: none;
        border: 0;
        padding: 2px 4px;
        cursor: pointer;
      }
      .review-pick:hover {
        background: #1f2a3a;
      }
      .review-pick.active {
        background: #26364d;
      }
      .review-mark {
        flex: none;
        width: 10px;
        font-weight: 700;
      }
      .review-mark.added {
        color: #fff;
      }
      .review-mark.altered {
        color: #ffd84a;
      }
      .review-mark.removed {
        color: #ff7b72;
      }
      .review-mark.moved {
        color: #9aa6b5;
      }
      .review-label {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .review-size {
        flex: none;
        color: #5b6b7e;
      }
      .review-flag {
        flex: none;
        font-size: 10px;
        padding: 0 4px;
        color: #e6b85c;
        border: 1px solid #e6b85c;
        border-radius: 2px;
      }
      /* A judged mark: a filled pill with a glyph, apart from the outlined tier tags. */
      .claim-line {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .claim-line > .review-pick {
        flex: 1;
        min-width: 0;
      }
      .review-judged {
        flex: none;
        display: inline-flex;
        gap: 4px;
        align-items: center;
        font: inherit;
        font-size: 10px;
        line-height: 16px;
        padding: 0 7px;
        border: 0;
        border-radius: 9px;
        cursor: pointer;
        background: #3a4658;
        color: #d6deea;
      }
      .review-judged.settled {
        background: #1f6f5a;
        color: #e8fff6;
      }
      .review-judged.settled.unadopted {
        background: transparent;
        color: #9fb2c7;
        box-shadow: inset 0 0 0 1px #5b6b80;
      }
      .review-judged.flagged {
        background: #a5541a;
        color: #fff1e3;
      }
      .review-judged.judging {
        background: #2a3a52;
        color: #9fc4f0;
        animation: judging-pulse 1.4s ease-in-out infinite;
      }
      @keyframes judging-pulse {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .review-judged.judging {
          animation: none;
        }
      }
      .review-judged.not-judged {
        background: #232c38;
        color: #8a9bb0;
      }
      .review-judged:focus-visible {
        outline: 2px solid #6cb6ff;
        outline-offset: 1px;
      }
      .judged-detail {
        margin: 4px 0 6px;
        padding-left: 8px;
        border-left: 2px solid #3a4658;
      }
      .judged-line,
      .judged-question {
        margin: 3px 0;
        overflow-wrap: anywhere;
      }
      .judged-question,
      .judged-exact {
        color: #8a9bb0;
      }
      .judged-key {
        margin: 6px 0 2px;
        font-size: 11px;
        color: #8a9bb0;
      }
      .judged-text {
        margin: 0;
        max-height: 14em;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 11px;
        padding: 4px 6px;
        background: #151b23;
        border-radius: 2px;
      }
      .review-mark.contract-effects {
        color: #6cb6ff;
      }
      .review-mark.contract-changed {
        color: #ffd84a;
      }
      .review-mark.contract-added {
        color: #fff;
      }
      .review-mark.contract-removed,
      .review-mark.contract-unexported {
        color: #ff7b72;
      }
      .review-mark.contract-exposed {
        color: #7ee787;
      }
      .review-mark.contract-moved {
        color: #9aa6b5;
      }
      .review-effects {
        margin-bottom: 6px;
      }
      .effect-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
      }
      .effect-chip {
        font-size: 10px;
        padding: 0 4px;
        border-radius: 2px;
        border: 1px solid #263140;
        white-space: nowrap;
      }
      .effect-chip.added {
        color: #7ee787;
        border-color: #1f4a2c;
      }
      .effect-chip.removed {
        color: #ff7b72;
        border-color: #5a2a2a;
      }
      .effect-chip.more {
        color: #9aa6b5;
      }
      .contract-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .contract-head {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .contract-where {
        color: #5b6b7e;
        overflow-wrap: anywhere;
      }
      .contract-sig {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #b8c4d2;
      }
      .contract-side {
        display: inline-block;
        width: 46px;
        color: #5b6b7e;
      }
      .contract-sig mark {
        color: inherit;
        padding: 0 1px;
      }
      .contract-sig mark.removed {
        background: #5a2a2a;
      }
      .contract-sig mark.added {
        background: #1f4a2c;
      }
      .signature-summary {
        list-style: none;
        margin: 2px 0;
        padding: 0;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        color: #d6dde6;
      }
      .signature-edit {
        overflow-wrap: anywhere;
      }
      .signature-raw {
        margin: 2px 0;
      }
      .signature-raw > summary {
        cursor: pointer;
        color: #5b6b7e;
        font-size: 11px;
      }
      .contract-members {
        list-style: none;
        margin: 0 0 2px 22px;
        padding: 0;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        color: #b8c4d2;
      }
      .contract-member {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .contract-member.added {
        color: #7fcf95;
      }
      .contract-member.removed {
        color: #e08a8a;
      }
      .contract-more {
        background: none;
        border: 0;
        padding: 0;
        color: #7fa6d6;
        cursor: pointer;
        font: inherit;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      #source {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 40%;
        display: flex;
        flex-direction: column;
        background: #0b0f14;
        color: #d6dee8;
        border-left: 1px solid #263140;
        box-shadow: -8px 0 16px #0008;
      }
      #source[hidden] {
        display: none;
      }
      #source header {
        flex: 0 1 auto;
        min-height: 0;
        max-height: 25%;
        overflow: auto;
        position: relative;
        padding: 8px 32px 8px 10px;
        border-bottom: 1px solid #263140;
      }
      #source-title {
        color: #ffd84a;
        overflow-wrap: anywhere;
      }
      #source-facts {
        color: #8a9bb0;
        overflow-wrap: anywhere;
      }
      #source-close {
        position: absolute;
        top: 6px;
        right: 6px;
        font: inherit;
        color: #8fb4d9;
        background: none;
        border: 0;
        padding: 2px 6px;
        cursor: pointer;
      }
      #source-close:hover {
        background: #1f2a3a;
        color: #e8edf2;
      }
      #outline {
        flex: 0 1 auto;
        min-height: 0;
        max-height: 60%;
        overflow: auto;
        padding: 4px 0;

      #source-code .row.band,
      #source-gutter .row.band {
        position: relative;

      /* An overlay, so the added and removed tints cannot hide the band. */
      #source-code .row.band::after,
      #source-gutter .row.band::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #ffd84a38;
        pointer-events: none;
      }
      #source-code .row.band-first::after,
      #source-gutter .row.band-first::after {
        border-top: 2px solid #ffd84a;
      }
      #source-code .row.band-last::after,
      #source-gutter .row.band-last::after {
        border-bottom: 2px solid #ffd84a;
      }
      #source-gutter .row.band::before {
        content: "";
        position: absolute;
        z-index: 1;
        left: -8px;
        top: 0;
        bottom: 0;
        width: 4px;
        background: #ffd84a;
      }
      #source-body {
        position: relative;
        flex: 1 1 40%;
        min-height: 0;
        display: flex;
        overflow: auto;
        line-height: 1.5;
      }
      #source-body pre {
        margin: 0;
        font: inherit;
        line-height: inherit;
      }
      #source-gutter {
        flex: none;
        position: sticky;
        left: 0;
        padding: 6px 8px;
        text-align: right;
        color: #5b6b7e;
        background: #0b0f14;
        border-right: 1px solid #1c2531;
        user-select: none;
      }
      #source-code {
        flex: 1 0 auto;
        padding: 6px 10px;
        tab-size: 2;
      }
      #source-code .row,
      #source-gutter .row,
      .walk-code .row,
      .walk-gutter .row {
        display: block;
        min-height: 1lh;
      }
      #source-code .row.added,
      .walk-code .row.added {
        background: #1f4a2c;
      }
      #source-gutter .row.added,
      .walk-gutter .row.added {
        color: #7ee787;
        background: #2a6a3c;
        box-shadow: inset 3px 0 #7ee787;
      }
      #source-code .row.removed,
      .walk-code .row.removed {
        color: #8a7a7a;
        background: #3a2020;
        text-decoration: line-through;
        text-decoration-color: #8a5a5a;
      }
      #source-gutter .row.removed,
      .walk-gutter .row.removed {
        color: #f08a8a;
        background: #5a2a2a;
      }
      .eol-note {
        color: #8a9bb0;
        font-style: italic;
        text-decoration: none;
      }
      .changed-note {
        color: #7ee787;
      }
      .walk-changes {
        flex: none;
        margin: 0;
        color: #7ee787;
      }
      .walk-changes[hidden] {
        display: none;
      }
      #walk {

        display: flex;
        flex-direction: column;

        color: #d6dee8;
        border-top: 1px solid #263140;
      }

        display: none;
      }

        height: 46vh;
      }

        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px 4px 10px;
      }
      .walk-bar .review-title {
        flex: none;
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .walk-status {
        flex: 1;
        min-width: 0;
        color: #b8c4d4;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .walk-coverage {
        flex: none;
        color: #8a9bb0;
      }
      .walk-effect {
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .walk-effect.added {
        color: #7ee787;
      }
      .walk-effect.removed {
        color: #ff7b72;
      }
      .walk-button,
      .walk-tab,
      .walk-call {
        font: inherit;
        color: #b8c8de;
        background: #121922;
        border: 1px solid #263140;
        padding: 2px 8px;
        cursor: pointer;
      }

        display: none;
      }

        opacity: 0.4;

      .walk-call:hover {
        background: #1f2a3a;
        color: #e8edf2;

      .walk-tab.active,
      .walk-call.active {
        background: #26364d;
        color: #fff;
      }
      .walk-body {

        min-height: 0;

        grid-template-columns: 1fr 1.4fr 2.4fr 0.7fr;
        border-top: 1px solid #263140;

        display: grid;
      }
      .walk-column {
        min-width: 0;

        flex-direction: column;
        border-right: 1px solid #263140;
      }
      .walk-column:last-child {
        border-right: 0;
      }
      .walk-head {
        flex: none;
        margin: 0;
        padding: 6px 10px 4px;
        font-size: 12px;
        color: #b8c4d4;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .review-tag.observed {
        border-style: dotted;
        color: #6cb6ff;
        border-color: #6cb6ff;
      }
      .walk-inner {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 2px 10px 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .walk-claim {
        flex: none;
      }
      .walk-sentence {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 1px;
        font: inherit;
        text-align: left;
        color: #e6d9b8;

      }

        background: #1f2a3a;
      }
      .walk-sentence.active {
        background: #26364d;
      }
      .walk-note {

        display: flex;
        align-items: baseline;
        gap: 6px;
        color: #ff9d8a;
        font-weight: 600;
      }
      .walk-note .review-tag {
        flex: none;
      }
      .walk-tabs,
      .walk-calls {
        flex: none;
        display: flex;

        gap: 4px;
      }
      .walk-facts {
        flex: none;
        max-height: 35%;

        display: flex;
        flex-direction: column;
        gap: 4px;

        margin: 0;
        display: flex;

        gap: 2px;

        overflow: auto;

        border: 1px solid #1c2531;

        margin: 0;
        font: inherit;
        line-height: inherit;

        position: sticky;

        padding: 6px 8px;

        color: #5b6b7e;
        background: #0b0f14;
        border-right: 1px solid #1c2531;
        user-select: none;
      }
      .walk-code {
        flex: none;
        padding: 6px 10px;
        tab-size: 2;
      }

        position: absolute;
        left: 0;
        z-index: 2;
        background: #ffd84a2e;
        border-top: 1px solid #ffd84a99;
        border-bottom: 1px solid #ffd84a99;
        pointer-events: none;
      }
      .walk-mark[hidden] {
        display: none;
      }
      .walk-observed {
        margin: 0;
        color: #6cb6ff;
        font-weight: 600;
      }
      .name {
        position: absolute;
        left: 0;
        top: 0;
        padding: 2px 7px;
        background: #0a0d12e6;
        color: #eef2f6;
        border: 1px solid #2c3a4d;
        border-left: 5px solid;
        border-radius: 2px;
        white-space: nowrap;
        line-height: 1.25;
      }
      .name-near {
        font-size: 15px;
        font-weight: 700;
      }
      .name-far {
        font-size: 12px;
      }
      .name-file {
        font-size: 12px;
        color: #fff;
        border-color: #fff;
      }
      .name-resource {
        font-size: 13px;
        font-weight: 700;
      }
      #tooltip {
        position: fixed;
        pointer-events: none;
        padding: 4px 6px;
        background: #000d;
        color: #e8edf2;
        /* A card, not a band: long lines wrap, and it may be as tall as the window so no fact is cut. */
        max-width: min(460px, calc(100vw - 8px));
        max-height: calc(100vh - 8px);
        overflow: hidden;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        display: none;
      }

      /* Narrow screens show one view at a time: the list, the town or the evidence. The others keep their size and scroll but are hidden, so coming back finds them as they were. */
      @media (max-width: 700px) {
        #find-box {
          position: static;
          padding: 0 4px;
        }
        #find {
          width: 38vw;
        }
        #find-results {
          left: 0;
          right: 0;
          top: 100%;
          width: auto;
          max-width: none;
        }
        #views {
          display: flex;
          flex: none;
          background: #0b0f14;
          border-bottom: 1px solid #263140;
        }
        #views button {
          flex: 1;
          min-height: 40px;
          font: inherit;
          font-size: 13px;
          color: #b8c8de;
          background: none;
          border: 0;
          border-bottom: 3px solid transparent;
          cursor: pointer;
        }
        #views button[aria-pressed="true"] {
          color: #fff;
          background: #121a24;
          border-bottom-color: #ffd84a;
        }
        #views button[aria-disabled="true"] {
          color: #5b6b7e;
          cursor: default;
        }
        #main {
          position: relative;
        }
        #review,
        #stage {
          position: absolute;
          inset: 0;
          width: auto;
          border-right: 0;
        }
        body[data-view="town"] #review,
        body[data-view="evidence"] #review,
        body[data-view="list"] #stage,
        body[data-view="town"] #source,
        body[data-view="evidence"] #controls,
        body[data-view="evidence"] #legend {
          visibility: hidden;
        }
        #source {
          width: 100%;
          border-left: 0;
          box-shadow: none;
        }
        #source header {
          max-height: 40%;
        }
        #source-back {
          display: inline-block;
          min-height: 32px;
          margin: 0 0 6px;
          padding: 4px 10px;
          font: inherit;
          color: #e8edf2;
          background: #1f2a3a;
          border: 1px solid #3b4d66;
          border-radius: 2px;
          cursor: pointer;
        }
        #source-close {
          top: 4px;
          right: 4px;
          min-width: 32px;
          min-height: 32px;
        }
        #walk.open {
          height: 52vh;
        }
        .walk-bar {
          flex-wrap: wrap;
          gap: 4px 6px;
          padding: 4px 8px;
        }
        .walk-bar .walk-button {
          min-height: 32px;
        }
        .walk-status {
          flex: 1 1 12ch;
          white-space: normal;
          overflow-wrap: anywhere;
        }
        #walk.open .walk-status {
          order: 3;
          flex-basis: 100%;
        }
        #walk.open .walk-body {
          display: block;
          overflow: auto;
        }
        .walk-column {
          border-right: 0;
          border-bottom: 1px solid #263140;
        }
        .walk-inner {
          overflow: visible;
        }
        .walk-source {
          min-height: 140px;
          max-height: 260px;
        }
        .walk-facts {
          max-height: none;
        }
        .walk-tab,
        .walk-call {
          max-width: 100%;
          text-align: left;
          overflow-wrap: anywhere;
        }
      }
    </style>
  </head>
  <body data-view="town">
    <header id="bar">
      <nav id="trail" aria-label="Zoom trail"></nav>
      <div id="pr-picker" hidden></div>
      <div id="find-box">
        <input id="find" type="search" role="combobox" aria-label="Find a file" aria-autocomplete="list" aria-expanded="false" aria-controls="find-results" placeholder="Find a file ( / )" autocomplete="off" spellcheck="false" />
        <ul id="find-results" role="listbox" aria-label="Matching files" hidden></ul>
      </div>
    </header>
    <p id="headline" aria-label="What the change did" hidden></p>
    <div id="find-status" class="sr-only" role="status" aria-live="polite"></div>
    <nav id="views" aria-label="View">
      <button type="button" data-view="list">List</button>
      <button type="button" data-view="town">Town</button>
      <button type="button" data-view="evidence">Evidence</button>
    </nav>
    <div id="main">
    <aside id="review" aria-label="Review" hidden></aside>
    <div id="stage">
      <div id="controls">
        <button id="reset" type="button" title="R">Reset view (R)</button>
      </div>
      <div id="legend" aria-label="Legend"></div>
      <aside id="source" aria-label="Source" hidden>
        <header>
          <button id="source-back" type="button">&lsaquo; Back</button>
          <div id="source-title"></div>
          <div id="source-facts"></div>
          <label id="narrate-toggle" hidden><input type="checkbox"> Narration</label>
          <button id="source-close" type="button" aria-label="Close source">&times;</button>
        </header>
        <div id="why" aria-label="Why this file matters" hidden></div>
        <div id="failure" aria-label="Failure" hidden></div>
        <div id="outline" aria-label="Pseudocode" hidden></div>
        <div id="narration" aria-label="Narration" hidden></div>
        <div id="source-body"><pre id="source-gutter"></pre><pre id="source-code"></pre></div>
      </aside>
    </div>
    </div>
    <section id="walk" aria-label="Walkthrough" hidden></section>
    <div id="tooltip"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
